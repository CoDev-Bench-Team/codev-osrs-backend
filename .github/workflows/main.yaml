name: Main

on:
    push:
        branches:
            - "**"
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1
            - name: Setup Node.js environment
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: "24"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Run linter
              run: npm run lint
            - name: Run tests
              run: npm test
            - name: Run build
              run: npm run build
