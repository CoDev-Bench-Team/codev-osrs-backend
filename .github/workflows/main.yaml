name: Main

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      # - name: Run tests
      #   run: npm test
      - name: Run build
        run: npm run build
  deploy:
    name: Deploy Production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      POSTGRESQL_HOST: ${{ secrets.POSTGRESQL_HOST }}
      POSTGRESQL_PORT: ${{ secrets.POSTGRESQL_PORT }}
      POSTGRESQL_USER: ${{ secrets.POSTGRESQL_USER }}
      POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
      POSTGRESQL_DATABASE: ${{ secrets.POSTGRESQL_DATABASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run database migrations
        run: npm run migration:run
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Sync production environment variables to Vercel
        env:
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          : "${CORS_ORIGINS:?Set CORS_ORIGINS in GitHub Actions variables}"
          : "${PORTAL_URL:?Set PORTAL_URL in GitHub Actions variables}"
          : "${ADMIN_EMAILS:?Set ADMIN_EMAILS in GitHub Actions variables}"

          printf '%s\n' "$CORS_ORIGINS" | vercel env add CORS_ORIGINS production --force --token="$VERCEL_TOKEN"
          printf '%s\n' "$PORTAL_URL" | vercel env add PORTAL_URL production --force --token="$VERCEL_TOKEN"
          printf '%s\n' "$ADMIN_EMAILS" | vercel env add ADMIN_EMAILS production --force --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --force --token="$VERCEL_TOKEN"
